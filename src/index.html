<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ipc: http://ipc.localhost; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>Purple Capture</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Zm8 8a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/></svg>
          </div>
          <div><strong>Purple Capture</strong><span id="app-version">v1.0.0</span></div>
        </div>
        <nav id="main-nav" aria-label="メインメニュー">
          <button class="nav-item active" data-page="recording">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle class="fill" cx="12" cy="12" r="3"/></svg>
            <span>録画</span>
          </button>
          <button class="nav-item" data-page="history">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.34-5.66L4 8.68"/><path d="M4 4v4.68h4.68M12 8v4l2.5 1.5"/></svg>
            <span>録画履歴</span>
          </button>
          <button class="nav-item" data-page="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.14.38.35.72.6 1 .3.3.7.42 1.1.4h.09v4h-.09a1.7 1.7 0 0 0-1.7.6Z"/></svg>
            <span>設定</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span class="status-dot ready"></span>
          <span id="sidebar-status">録画準備完了</span>
        </div>
      </aside>

      <main class="main-content">
        <section id="page-recording" class="page active" aria-labelledby="recording-title">
          <header class="page-header">
            <div><p class="eyebrow">SCREEN RECORDER</p><h1 id="recording-title">録画</h1></div>
            <button id="refresh-sources" class="button subtle">
              <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
              更新
            </button>
          </header>

          <div class="source-tabs" role="tablist">
            <button class="source-tab active" data-source-type="monitor">モニター</button>
            <button class="source-tab" data-source-type="window">ウィンドウ</button>
            <button class="source-tab" data-source-type="browser">共有タブ</button>
          </div>

          <div id="recording-error" class="alert error hidden" role="alert"></div>
          <section id="share-panel" class="share-panel card hidden" aria-label="共有タブの操作">
            <div class="share-panel-copy">
              <span class="share-panel-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 22h8M12 19v3M9 10l3-3 3 3M12 7v7"/></svg>
              </span>
              <div>
                <strong>ブラウザタブを共有して録画</strong>
                <small id="share-status">未共有です。外部ブラウザで録画するタブを手動選択してください。</small>
              </div>
            </div>
            <div class="share-panel-actions">
              <button id="share-tab" class="button primary">タブを共有</button>
              <button id="stop-share" class="button danger hidden">共有停止</button>
            </div>
          </section>
          <div id="source-list" class="source-grid" aria-live="polite"></div>

          <section class="quick-settings card">
            <div class="setting-item">
              <label for="quality">画質</label>
              <select id="quality"><option value="standard">標準画質</option><option value="high">高画質</option></select>
            </div>
            <div class="setting-item">
              <label for="fps">フレームレート</label>
              <select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option></select>
            </div>
            <label class="toggle-row">
              <span><b>システム音声</b><small>PCから流れる音</small></span>
              <input id="system-audio" type="checkbox" checked /><i></i>
            </label>
            <label class="toggle-row">
              <span><b>マイク</b><small id="mic-summary">既定のマイク</small></span>
              <input id="microphone" type="checkbox" /><i></i>
            </label>
          </section>

          <div class="recording-bar card">
            <div class="recording-target">
              <span id="recording-indicator" class="recording-dot"></span>
              <div><small id="recording-state-label">録画対象</small><strong id="selected-target-name">対象を選択してください</strong></div>
            </div>
            <div id="timer" class="timer">00:00:00</div>
            <div class="recording-actions">
              <button id="pause-recording" class="button secondary hidden">一時停止</button>
              <button id="stop-recording" class="button danger hidden">停止</button>
              <button id="start-recording" class="button primary large" disabled>
                <span class="record-icon"></span>録画を開始
              </button>
            </div>
          </div>
        </section>

        <section id="page-history" class="page" aria-labelledby="history-title">
          <header class="page-header">
            <div><p class="eyebrow">RECORDINGS</p><h1 id="history-title">録画履歴</h1></div>
            <button id="open-recordings-folder" class="button subtle">保存フォルダを開く</button>
          </header>
          <div id="history-list" class="history-list"></div>
        </section>

        <section id="page-settings" class="page" aria-labelledby="settings-title">
          <header class="page-header"><div><p class="eyebrow">PREFERENCES</p><h1 id="settings-title">設定</h1></div></header>
          <div class="settings-layout">
            <section class="card settings-card">
              <h2>保存</h2>
              <div class="form-row">
                <label for="save-path">録画の保存先</label>
                <div class="path-control"><input id="save-path" type="text" readonly /><button id="choose-save-path" class="button secondary">選択</button></div>
                <small>完成した録画だけが、このフォルダへ移動されます。</small>
              </div>
            </section>
            <section class="card settings-card">
              <h2>音声</h2>
              <div class="form-row"><label for="mic-device">マイクデバイス</label><select id="mic-device"></select></div>
            </section>
            <section class="card settings-card">
              <h2>録画の既定値</h2>
              <div class="two-column">
                <div class="form-row"><label for="default-quality">画質</label><select id="default-quality"><option value="standard">標準画質</option><option value="high">高画質</option></select></div>
                <div class="form-row"><label for="default-fps">FPS</label><select id="default-fps"><option value="30">30 FPS</option><option value="60">60 FPS</option></select></div>
              </div>
            </section>
            <section class="card settings-card about">
              <h2>このアプリについて</h2>
              <p>Purple Capture <span id="settings-version">1.0.0</span></p>
              <small>Windows.Graphics.Capture · Media Foundation · WASAPI · WebView2</small>
            </section>
          </div>
        </section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
