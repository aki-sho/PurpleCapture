[package]
name = "purplecapture"
version = "1.0.0"
description = "Windows 10・11向けのシンプルなポータブル画面録画アプリ"
authors = ["Purple Capture contributors"]
edition = "2024"
license = "LicenseRef-Proprietary-Undecided"

[lib]
name = "purplecapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "PurpleCapture"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.0"
uuid = { version = "1", features = ["v4"] }
windows-capture = "2.0.0"
wasapi = "0.23.0"

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
